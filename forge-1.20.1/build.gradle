buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }

    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'


group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}


java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}


configurations {
    library
    implementation.extendsFrom library
}


repositories {
    mavenCentral()
    mavenLocal()

    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Illusive Soulworks"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url = "https://www.cursemaven.com"
    }
}


minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            /*
             * ForgeGradle's Minecraft launcher does not automatically
             * include ordinary Gradle project dependencies in the game
             * runtime classpath.
             *
             * This explicitly adds :common.
             */
            lazyToken('minecraft_classpath') {
                configurations.library
                        .copyRecursive()
                        .resolve()
                        .collect { it.absolutePath }
                        .join(File.pathSeparator)
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}


/*
 * Uncomment these if Vital Relics actually uses Mixins.
 *
 * mixin {
 *     add sourceSets.main, "${mod_id}.refmap.json"
 *     config "${mod_id}.mixins.json"
 * }
 */


/*
 * Resources shared with all loader/version adapters.
 */
sourceSets.main.resources {
    srcDir "src/generated/resources"
    srcDir project(":common").file("src/main/resources")
}


dependencies {
    /*
     * Shared Java implementation.
     *
     * implementation extends from library, so this is available
     * during compilation as well as through minecraft_classpath above.
     */
    library project(":common")

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'


    // Curios API: compile against it, but don't bundle Curios into our JAR.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")

    // Curios itself in runClient.
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    /*
     * Optional Touhou Little Maid compile integration.
     *
     * This only makes its classes available during compilation.
     * Users do not need TLM installed unless your code actually
     * declares it as a mandatory runtime dependency.
     */
    implementation fg.deobf(
            "curse.maven:touhou-little-maid-${tlm_file_id}"
    )
}


/*
 * Expand ${...} placeholders in mods.toml / pack.mcmeta.
 */
tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,

            forge_version           : forge_version,
            forge_version_range     : forge_version_range,

            loader_version_range    : loader_version_range,

            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching([
            'META-INF/mods.toml',
            'pack.mcmeta'
    ]) {
        expand replaceProperties + [project: project]
    }
}


/*
 * Final mod JAR metadata + Forge reobfuscation.
 */
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"       : mod_id,
                "Specification-Vendor"      : mod_authors,
                "Specification-Version"     : "1",

                "Implementation-Title"      : project.name,
                "Implementation-Version"    : project.jar.archiveVersion,
                "Implementation-Vendor"     : mod_authors,

                "Implementation-Timestamp"  :
                        new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

