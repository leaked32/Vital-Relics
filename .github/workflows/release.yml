name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3"
        required: true
        type: string

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      # ------------------------------
      # Forge 1.20.1
      # ------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Forge 1.20.1
        run: gradle :forge-1.20.1:build

      # ------------------------------
      # NeoForge 1.21.1
      # ------------------------------

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build NeoForge 1.21.1
        run: gradle :neoforge-1.21.1:build

      # ------------------------------
      # Prepare release artifacts
      # ------------------------------

      - name: Prepare release JARs
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"

          mkdir -p release

          FORGE_JAR=$(find forge-1.20.1/build/libs \
            -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          NEOFORGE_JAR=$(find neoforge-1.21.1/build/libs \
            -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          test -n "$FORGE_JAR"
          test -n "$NEOFORGE_JAR"

          cp "$FORGE_JAR" \
            "release/vitalrelics-forge-1.20.1-${VERSION}.jar"

          cp "$NEOFORGE_JAR" \
            "release/vitalrelics-neoforge-1.21.1-${VERSION}.jar"

      # ------------------------------
      # Diagnostics
      # ------------------------------

      - name: Show release JARs
        run: ls -lh release/

      # ------------------------------
      # Release
      # ------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/vitalrelics-forge-1.20.1-*.jar
            release/vitalrelics-neoforge-1.21.1-*.jar