name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0-beta"
        required: true
        type: string

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------
      # Forge 1.20.1
      # ------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Forge 1.20.1
        run: gradle :forge-1.20.1:build

      # ------------------------------
      # NeoForge 1.21.1
      # ------------------------------

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build NeoForge 1.21.1
        run: gradle :neoforge-1.21.1:build

      # ------------------------------
      # Diagnostics
      # ------------------------------

      - name: Show built JARs
        run: |
          echo "Forge:"
          find forge-1.20.1/build/libs -type f -name "*.jar" -print

          echo "NeoForge:"
          find neoforge-1.21.1/build/libs -type f -name "*.jar" -print

      # ------------------------------
      # Release
      # ------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            forge-1.20.1/build/libs/*.jar
            neoforge-1.21.1/build/libs/*.jar