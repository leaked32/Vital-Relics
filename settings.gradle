pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = "https://maven.neoforged.net/releases" }
        maven {
            name = "MinecraftForge"
            url = "https://maven.minecraftforge.net/"
        }
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

rootProject.name = "VitalRelics"

include("common")

def targets = [
        "forge-1.20.1",
        "neoforge-1.21.1",
        "neoforge-1.21.8",
        "neoforge-26.2"
]

def requestedTasks = gradle.startParameter.taskNames

def selectedTargets = targets.findAll { target ->
    requestedTasks.any { task ->
        task.startsWith(":${target}:")
    }
}

selectedTargets.each { target ->
    include(target)
}